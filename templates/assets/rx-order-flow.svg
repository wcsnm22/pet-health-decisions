<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Infographic: how to buy pet prescription meds online legally - three steps at checkout, then Chewy processes a received prescription in 24-48 hours and delivers in 3-5 days, while 1-800-PetMeds requires vet approval before shipment and prints standard delivery in 2-5 business days with free shipping over 49 dollars">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif">

    <text x="8" y="26" font-size="19" font-weight="700" fill="#0f172a">Buying prescription pet meds online: the legal step and the clock</text>
    <text x="8" y="50" font-size="13.5" fill="#475569">The three checkout steps are Chewy's own wording; the timelines are the figures each pharmacy prints. Read 2026-09-26.</text>

    <!-- three steps -->
    <g>
      <rect x="8" y="68" width="296" height="126" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="26" y="96" font-size="16" font-weight="700" fill="#0f172a">1. Add the medication</text>
      <text x="26" y="122" font-size="13" fill="#334155">Search the pharmacy and add the</text>
      <text x="26" y="141" font-size="13" fill="#334155">prescription item to your cart. A</text>
      <text x="26" y="160" font-size="13" fill="#334155">written script is not needed yet at</text>
      <text x="26" y="179" font-size="13" fill="#334155">Chewy (its own FAQ says so).</text>

      <rect x="332" y="68" width="296" height="126" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="350" y="96" font-size="16" font-weight="700" fill="#0f172a">2. Enter pet + vet details</text>
      <text x="350" y="122" font-size="13" fill="#334155">At checkout add your pet's</text>
      <text x="350" y="141" font-size="13" fill="#334155">information and your vet clinic's</text>
      <text x="350" y="160" font-size="13" fill="#334155">details, then pick the approval</text>
      <text x="350" y="179" font-size="13" fill="#334155">method (contact my vet / mail it).</text>

      <rect x="656" y="68" width="296" height="126" rx="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
      <text x="674" y="96" font-size="16" font-weight="700" fill="#0f172a">3. Vet authorization</text>
      <text x="674" y="122" font-size="13" fill="#334155">The pharmacy confirms the script</text>
      <text x="674" y="141" font-size="13" fill="#334155">with your vet. No authorization,</text>
      <text x="674" y="160" font-size="13" fill="#334155">no dispense - both pharmacies</text>
      <text x="674" y="179" font-size="13" fill="#334155">state this in their own words.</text>
    </g>
    <line x1="306" y1="131" x2="328" y2="131" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>
    <line x1="630" y1="131" x2="652" y2="131" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>

    <!-- timelines -->
    <rect x="8" y="210" width="944" height="150" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="26" y="238" font-size="15.5" font-weight="700" fill="#0f172a">The clock each pharmacy prints</text>

    <text x="26" y="272" font-size="14" font-weight="700" fill="#0f172a">Chewy Pharmacy</text>
    <rect x="176" y="254" width="212" height="30" rx="8" fill="#cbd5e1"/>
    <text x="186" y="274" font-size="13" fill="#0f172a">processed in 24-48 hrs</text>
    <line x1="392" y1="269" x2="412" y2="269" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>
    <rect x="418" y="254" width="256" height="30" rx="8" fill="#94a3b8"/>
    <text x="428" y="274" font-size="13" fill="#0f172a">delivered in 3-5 days after approval</text>
    <text x="690" y="274" font-size="12.5" fill="#475569">paper script: ships in 1-2 days</text>

    <text x="26" y="322" font-size="14" font-weight="700" fill="#0f172a">1-800-PetMeds</text>
    <rect x="176" y="304" width="212" height="30" rx="8" fill="#cbd5e1"/>
    <text x="186" y="324" font-size="13" fill="#0f172a">vet approval before shipping</text>
    <line x1="392" y1="319" x2="412" y2="319" stroke="#64748b" stroke-width="2.5" marker-end="url(#arw)"/>
    <rect x="418" y="304" width="256" height="30" rx="8" fill="#94a3b8"/>
    <text x="428" y="324" font-size="13" fill="#0f172a">standard delivery 2-5 business days</text>
    <text x="690" y="324" font-size="12.5" fill="#475569">free shipping over $49</text>

    <text x="26" y="350" font-size="12" fill="#64748b">Bars are the published windows only - neither pharmacy promises a delivery date before the vet signs off.</text>

    <!-- footer -->
    <rect x="8" y="376" width="944" height="86" rx="14" fill="#0f172a"/>
    <text x="26" y="404" font-size="14.5" font-weight="700" fill="#f8fafc">What makes the purchase legal</text>
    <text x="26" y="428" font-size="13" fill="#e2e8f0">Chewy Pharmacy: only dispenses with a valid, patient-specific prescription from a licensed veterinarian (compounding pharmacy licensed in Kentucky</text>
    <text x="26" y="448" font-size="13" fill="#e2e8f0">and in each state it ships to, PCAB accredited). 1-800-PetMeds: all prescription medications must have an authorization before they are dispensed.</text>
  </g>
</svg>
